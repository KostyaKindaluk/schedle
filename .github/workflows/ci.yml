name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  tests-and-lint:
    name: Tests and lint on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: backend

    env:
      SECRET_KEY: test-secret-key
      DEBUG: "1"
      ALLOWED_HOSTS: "*"
      # Якщо в тебе в settings.py явно потрібен DJANGO_SETTINGS_MODULE,
      # розкоментуй і заміни на свій:
      # DJANGO_SETTINGS_MODULE: your_project.settings

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-html ruff

      - name: Run migrations
        run: |
          python manage.py migrate

      - name: Run Ruff linting
        run: |
          ruff check .

      - name: Run Pytest and generate HTML report
        run: |
          mkdir -p reports
          pytest --html=reports/pytest-report.html --self-contained-html

      - name: Upload Pytest HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report-python-${{ matrix.python-version }}
          path: backend/reports/pytest-report.html

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t django-backend-test .